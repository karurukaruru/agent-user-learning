<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">Agent User Learning workflow</title>
  <desc id="desc">The host chooses scopes, AUL reads relevant context, and the agent responds. After the turn, the host extracts user events. AUL validates and writes those events to a per-user store, which supplies context for the next task. Users can inspect, explain, correct and forget records.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#42516a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="loop" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 10 6 L 1 11" fill="none" stroke="#187e87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'DejaVu Sans', sans-serif; }
      .title { font-size: 60px; font-weight: 700; fill: #18243b; }
      .subtitle { font-size: 28px; fill: #56647a; }
      .label { font-size: 21px; font-weight: 700; letter-spacing: 1.4px; }
      .heading { font-size: 34px; font-weight: 700; fill: #18243b; }
      .body { font-size: 26px; fill: #46546b; }
      .connector { font-size: 22px; fill: #56647a; }
      .line { fill: none; stroke: #42516a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1800" height="1240" fill="#f7f9fc"/>
  <rect x="80" y="64" width="8" height="122" rx="4" fill="#187e87"/>
  <text class="title" x="112" y="119">Agent User Learning</text>
  <text class="subtitle" x="112" y="171">Relevant user context, updated from evidence.</text>
  <rect x="1280" y="83" width="18" height="18" rx="5" fill="#b8a4de"/>
  <text class="connector" x="1311" y="100">Host / agent</text>
  <rect x="1510" y="83" width="18" height="18" rx="5" fill="#79b8c4"/>
  <text class="connector" x="1541" y="100">AUL</text>

  <text class="label" x="80" y="247" fill="#56647a">BEFORE AND DURING A TASK</text>
  <rect x="80" y="280" width="440" height="230" rx="22" fill="#f1ecfa" stroke="#d1c1ea" stroke-width="2"/>
  <text class="label" x="112" y="324" fill="#7653a4">1 · HOST</text>
  <text class="heading" x="112" y="375">Choose scopes</text>
  <text class="body" x="112" y="423">User request + task labels</text>
  <text class="body" x="112" y="462">Read one context snapshot</text>

  <rect x="680" y="280" width="440" height="230" rx="22" fill="#e8f4f6" stroke="#a6d3da" stroke-width="2"/>
  <text class="label" x="712" y="324" fill="#187e87">2 · AUL</text>
  <text class="heading" x="712" y="375">Select context</text>
  <text class="body" x="712" y="423">Scopes + expiry + budget</text>
  <text class="body" x="712" y="462">Active attributes + rules</text>

  <rect x="1280" y="280" width="440" height="230" rx="22" fill="#f1ecfa" stroke="#d1c1ea" stroke-width="2"/>
  <text class="label" x="1312" y="324" fill="#7653a4">3 · AGENT</text>
  <text class="heading" x="1312" y="375">Respond / act</text>
  <text class="body" x="1312" y="423">Use relevant user context</text>
  <text class="body" x="1312" y="462">Follow the current request</text>

  <path class="line" d="M 520 400 H 680"/>
  <text class="connector" x="548" y="378">scopes</text>
  <path class="line" d="M 1120 400 H 1280"/>
  <text class="connector" x="1142" y="378">context</text>
  <path class="line" d="M 1500 510 V 780"/>
  <text class="connector" x="1524" y="648">after turn</text>

  <path d="M 300 780 V 610 H 900 V 510" fill="none" stroke="#187e87" stroke-width="3" marker-end="url(#loop)"/>
  <rect x="425" y="584" width="356" height="46" rx="12" fill="#f7f9fc"/>
  <text x="444" y="615" font-size="23" fill="#187e87" font-weight="700">Next task: active records</text>

  <text class="label" x="680" y="747" fill="#56647a">AFTER A TURN · LEARN AND REVISE</text>
  <rect x="80" y="780" width="440" height="245" rx="22" fill="#e8f4f6" stroke="#a6d3da" stroke-width="2"/>
  <text class="label" x="112" y="824" fill="#187e87">6 · AUL</text>
  <text class="heading" x="112" y="875">Per-user store</text>
  <text class="body" x="112" y="923">SQLite events + sources</text>
  <text class="body" x="112" y="964">Replay records on reads</text>

  <rect x="680" y="780" width="440" height="245" rx="22" fill="#e8f4f6" stroke="#a6d3da" stroke-width="2"/>
  <text class="label" x="712" y="824" fill="#187e87">5 · AUL</text>
  <text class="heading" x="712" y="875">Validate + write</text>
  <text class="body" x="712" y="923">Fields, IDs and version</text>
  <text class="body" x="712" y="964">Evidence + candidates</text>

  <rect x="1280" y="780" width="440" height="245" rx="22" fill="#f1ecfa" stroke="#d1c1ea" stroke-width="2"/>
  <text class="label" x="1312" y="824" fill="#7653a4">4 · HOST</text>
  <text class="heading" x="1312" y="875">Extract events</text>
  <text class="body" x="1312" y="923">Trusted user statements</text>
  <text class="body" x="1312" y="964">Preferences + corrections</text>

  <path class="line" d="M 1280 920 H 1120"/>
  <text class="connector" x="1158" y="898">events</text>
  <path class="line" d="M 680 920 H 520"/>
  <text class="connector" x="570" y="898">write</text>

  <rect x="80" y="1080" width="1640" height="76" rx="18" fill="#ffffff" stroke="#dce3ed" stroke-width="2"/>
  <text x="112" y="1128" font-size="27" font-weight="700" fill="#18243b">User control</text>
  <text x="380" y="1128" font-size="27" fill="#46546b">Inspect</text>
  <text x="632" y="1128" font-size="27" fill="#46546b">Explain</text>
  <text x="908" y="1128" font-size="27" fill="#46546b">Correct</text>
  <text x="1190" y="1128" font-size="27" fill="#46546b">Forget</text>
  <text x="1450" y="1128" font-size="24" fill="#187e87">SDK · CLI · Skill</text>
  <text x="80" y="1200" font-size="22" fill="#56647a">The host supplies extraction and agent calls. AUL validates, stores and selects user context.</text>
</svg>
