[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-user-learning"
version = "0.1.0"
description = "An evidence-based user understanding and adaptation layer for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "karurukaruru"}]
keywords = ["agent", "personalization", "user-learning", "skill"]
dependencies = []

[project.scripts]
aul = "agent_user_learning.engine:main"

[tool.setuptools.packages.find]
where = ["src"]
